name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: npm install

      - name: Generate app icons
        run: npm run tauri -- icon app-icon.png

      - name: Build Tauri app
        run: npm run tauri -- build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: boss-key-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: boss-key-portable-exe
          path: |
            src-tauri/target/release/boss-key.exe
          if-no-files-found: warn
